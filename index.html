<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои карты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-tabs">
                <span class="tab active">Мои карты</span>
                <span class="tab">Другие карты</span>
            </div>
            <div class="header-bell"></div>
        </header>
        <main class="main-content">
            <section class="card-section">
                <div class="card card-virtual">
                    <div class="card-row">
                        <span class="card-type">Virtual</span>
                        <button class="card-btn">Единая</button>
                    </div>
                    <div class="card-balance-row">
                        <span class="card-balance">100 <span class="currency">₸</span></span>
                        <button class="card-plus">+</button>
                    </div>
                    <div class="card-trip">1 поездка, Караганда</div>
                    <button class="card-details">Детали карты</button>
                </div>
            </section>
            <section class="actions-section">
                <button class="action-btn">Пополнить</button>
                <button class="action-btn">Перевести</button>
                <button class="action-btn">История</button>
            </section>
            <section class="promo-section">
                <div class="promo-slider">
                    <div class="promo-slide"><img src="1/image1.png" alt="promo1"></div>
                    <div class="promo-slide"><img src="1/image2.png" alt="promo2"></div>
                    <div class="promo-slide"><img src="1/image3.png" alt="promo3"></div>
                    <div class="promo-slide"><img src="1/image4.png" alt="promo4"></div>
                </div>
                <!-- dots removed -->
            </section>
            <script>
            // Автоматический слайдер для промо-картинок
            (function() {
                const slides = document.querySelectorAll('.promo-slide');
                let current = 0;
                function showSlide(idx) {
                    slides.forEach((slide, i) => {
                        slide.style.display = i === idx ? 'block' : 'none';
                    });
                }
                function nextSlide() {
                    current = (current + 1) % slides.length;
                    showSlide(current);
                }
                showSlide(current);
                setInterval(nextSlide, 7000);
            })();
            </script>
            <section class="quick-actions-section">
                <button class="quick-action">
                    <div class="quick-action-icon orange"></div>
                    <span>Оплатить по коду</span>
                </button>
                <button class="quick-action">
                    <div class="quick-action-icon green"></div>
                    <span>Мои билеты</span>
                </button>
                <button class="quick-action">
                    <div class="quick-action-icon purple"></div>
                    <span>Проездной</span>
                </button>
            </section>
            <section class="offers-section">
                <h2>Предложения для Вас</h2>
            </section>
        </main>
            <nav class="bottom-nav">
            <button class="nav-btn">
                                <div class="nav-icon bus">
                                    <img src="Снимок экрана 2026-02-20 183620.png" alt="bus icon" width="28" height="28" style="display:block;width:28px;height:28px;" />
                                </div>
                <span>Маршруты</span>
            </button>
            <button class="nav-btn">
                                <div class="nav-icon card">
                                    <img src="image.png" alt="card icon" width="28" height="28" style="display:block;width:28px;height:28px;" />
                                </div>
                <span>Карты</span>
            </button>
                        <button class="nav-btn nav-btn-center">
                                <div class="nav-icon qr"></div>
                        </button>
            <button class="nav-btn">
                                <div class="nav-icon shop">
                                    <img src="Снимок экрана 2026-02-20 193153.png" alt="shop icon" width="28" height="28" style="display:block;width:28px;height:28px;" />
                                </div>
                <span>Магазин</span>
            </button>
            <button class="nav-btn">
                                <div class="nav-icon menu">
                                    <img src="Снимок экрана 2026-02-20 184155.png" alt="menu icon" width="28" height="28" style="display:block;width:28px;height:28px;" />
                                </div>
                <span>Меню</span>
            </button>
        </nav>
    </div>
</body>
</html>
<style>
.qr-overlay {
    position: fixed;
    left: 0; top: 0; width: 100vw; height: 100vh;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}
.qr-header {
    width: 100vw;
    display: flex;
    align-items: center;
    padding: 18px 0 0 0;
    color: #111;
    background: #fff;
    font-size: 1.2em;
    font-weight: 600;
    min-height: 56px;
    box-sizing: border-box;
}
.qr-header .qr-back {
    font-size: 2em;
    margin: 0 18px 0 12px;
    cursor: pointer;
}
.qr-header-title {
    flex: 1;
    text-align: left;
}
.qr-instruction {
    color: #fff;
    text-align: center;
    margin: 32px 16px 0 16px;
    font-size: 1.1em;
    font-weight: 400;
}
.qr-frame {
    position: absolute;
    left: 50%;
    top: 38%;
    width: 70vw;
    max-width: 340px;
    aspect-ratio: 1/1;
    transform: translate(-50%, -50%);
    border-radius: 18px;
    pointer-events: none;
}
.qr-corner {
    position: absolute;
    width: 36px;
    height: 36px;
    border: 3px solid #ffe600;
    border-radius: 8px;
}
.qr-corner.tl { left: 0; top: 0; border-right: none; border-bottom: none; }
.qr-corner.tr { right: 0; top: 0; border-left: none; border-bottom: none; }
.qr-corner.bl { left: 0; bottom: 0; border-right: none; border-top: none; }
.qr-corner.br { right: 0; bottom: 0; border-left: none; border-top: none; }
.qr-manual {
    position: absolute;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%);
    color: #fff;
    text-decoration: underline;
    font-size: 1.1em;
    cursor: pointer;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// Сканер QR-кода с оформлением как в приложении
document.querySelector('.nav-btn-center').addEventListener('click', function() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
                        .then(function(stream) {
                                // Оверлей
                                let overlay = document.createElement('div');
                                overlay.className = 'qr-overlay';

                                // Шапка
                                overlay.innerHTML = `
                                    <div class="qr-header">
                                        <span class="qr-back">&#8592;</span>
                                        <span class="qr-header-title">Использование QR</span>
                                    </div>
                                    <div class="qr-instruction">
                                        <span style='display:inline-block;vertical-align:middle;font-size:2em;margin-right:10px;'>⚡</span>
                                        <span>Наведите камеру на QR-код, чтобы оплатить проезд в транспорте или в сети партнеров ONAY!</span>
                                    </div>
                                `;

                                // Видео
                                let video = document.createElement('video');
                                video.setAttribute('playsinline', 'true');
                                video.style.position = 'absolute';
                                video.style.left = '0';
                                video.style.top = '0';
                                video.style.width = '100vw';
                                video.style.height = '100vh';
                                video.style.objectFit = 'cover';
                                video.style.zIndex = '1';
                                video.autoplay = true;
                                video.srcObject = stream;
                                overlay.appendChild(video);
                                document.body.appendChild(overlay);
                                video.play();

                                // Жёлтая рамка
                                let frame = document.createElement('div');
                                frame.className = 'qr-frame';
                                frame.innerHTML = `
                                    <div class="qr-corner tl"></div>
                                    <div class="qr-corner tr"></div>
                                    <div class="qr-corner bl"></div>
                                    <div class="qr-corner br"></div>
                                `;
                                overlay.appendChild(frame);

                                // Кнопка ручного ввода
                                let manual = document.createElement('div');
                                manual.className = 'qr-manual';
                                manual.innerHTML = 'Ввод кода вручную';
                                overlay.appendChild(manual);

                                // Canvas для сканирования
                                let canvas = document.createElement('canvas');
                                let ctx = canvas.getContext('2d');

                                function scan() {
                                        if (video.readyState === video.HAVE_ENOUGH_DATA) {
                                                canvas.width = video.videoWidth;
                                                canvas.height = video.videoHeight;
                                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                                let code = jsQR(imageData.data, canvas.width, canvas.height);
                                                if (code) {
                                                        alert('QR-код: ' + code.data);
                                                        stream.getTracks().forEach(track => track.stop());
                                                        overlay.remove();
                                                        return;
                                                }
                                        }
                                        requestAnimationFrame(scan);
                                }
                                scan();

                                // Закрытие по кнопке назад
                                overlay.querySelector('.qr-back').onclick = function() {
                                        stream.getTracks().forEach(track => track.stop());
                                        overlay.remove();
                                };
                                // Закрытие по ручному вводу
                                manual.onclick = function() {
                                        stream.getTracks().forEach(track => track.stop());
                                        overlay.remove();
                                        alert('Переход к ручному вводу (реализуйте по необходимости)');
                                };
                        })
                        .catch(function(err) {
                                alert('Не удалось открыть камеру: ' + err);
                        });
        } else {
                alert('Камера не поддерживается вашим браузером.');
        }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
// Сканер QR-кода с использованием rear camera
document.querySelector('.nav-btn-center').addEventListener('click', function() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } })
            .then(function(stream) {
                let video = document.createElement('video');
                video.setAttribute('playsinline', 'true');
                video.style.position = 'fixed';
                video.style.left = '0';
                video.style.top = '0';
                video.style.width = '100vw';
                video.style.height = '100vh';
                video.style.objectFit = 'cover';
                video.style.zIndex = '9999';
                video.autoplay = true;
                video.srcObject = stream;
                document.body.appendChild(video);
                video.play();

                // Canvas для сканирования
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');

                function scan() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        let code = jsQR(imageData.data, canvas.width, canvas.height);
                        if (code) {
                            alert('QR-код: ' + code.data);
                            stream.getTracks().forEach(track => track.stop());
                            video.remove();
                            return;
                        }
                    }
                    requestAnimationFrame(scan);
                }
                scan();

                // Закрытие по клику
                video.addEventListener('click', function() {
                    stream.getTracks().forEach(track => track.stop());
                    video.remove();
                });
            })
            .catch(function(err) {
                alert('Не удалось открыть камеру: ' + err);
            });
    } else {
        alert('Камера не поддерживается вашим браузером.');
    }
});
</script>
<script>

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {

                video.style.width = '100vw';
                video.style.height = '100vh';
                video.style.objectFit = 'cover';
                video.style.zIndex = '9999';
                video.autoplay = true;
                video.srcObject = stream;
                document.body.appendChild(video);
                // Закрытие по клику
                video.addEventListener('click', function() {
                    stream.getTracks().forEach(track => track.stop());
                    video.remove();
                });
            })
            .catch(function(err) {
                alert('Не удалось открыть камеру: ' + err);
            });
    } else {
        alert('Камера не поддерживается вашим браузером.');
    }
});
